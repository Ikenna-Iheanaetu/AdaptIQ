# ── App ──────────────────────────────────────────
spring.application.name=AdaptIQ

# ── Server ───────────────────────────────────────
server.port=8080

# ── Database (PostgreSQL) ────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/adaptiq_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────
jwt.secret=${JWT_SECRET:changeme_use_a_long_random_string_in_production}
jwt.expiration.ms=2592000000

# ── OpenAI ───────────────────────────────────────
openai.api.key=${OPENAI_API_KEY:your_openai_key_here}
openai.model=gpt-4o
openai.max-tokens=800

# ── CORS ─────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Mail (for password reset) ────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
